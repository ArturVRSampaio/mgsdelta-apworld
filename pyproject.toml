[project]
name = "mgsdelta-apworld"
version = "0.1.0"
description = "Archipelago world implementation for Metal Gear Solid Delta: Snake Eater"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "mutmut==3.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mgsdelta*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90"]
# N999: Archipelago's own worlds all use PascalCase module names
# (Items.py, Locations.py, Rules.py, ...) — matching that convention on
# purpose, not an oversight.
ignore = ["N999"]
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.12"
strict = true
files = ["mgsdelta", "scripts"]
exclude = ["mgsdelta/test"]

[tool.pytest.ini_options]
testpaths = ["mgsdelta/test"]

[tool.coverage.run]
source = ["mgsdelta"]
omit = ["mgsdelta/test/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
paths_to_mutate = ["mgsdelta/"]
do_not_mutate = ["mgsdelta/test/*"]
runner = "python -m pytest -x -q"
