[project]
name = "mgsdelta-apworld"
version = "0.1.0"
description = "Archipelago world implementation for Metal Gear Solid Delta: Snake Eater"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==9.0.3",  # 8.3.3 has CVE-2025-71176 (insecure tmpdir handling)
    "pytest-cov==5.0.0",
    "mutmut==3.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mgsdelta*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Archipelago is a vendored submodule (real core, needed to import
# worlds.AutoWorld/BaseClasses for testing) — not our code, don't lint/format it.
extend-exclude = ["Archipelago"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90"]
# N999: Archipelago's own worlds all use PascalCase module names
# (Items.py, Locations.py, Rules.py, ...) — matching that convention on
# purpose, not an oversight.
ignore = ["N999"]
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.12"
strict = true
files = ["mgsdelta", "scripts"]
exclude = ["mgsdelta/test"]
# Archipelago core (BaseClasses/World/etc.) intentionally stays off mypy_path:
# pointing mypy at the submodule would make it follow AutoWorld's imports
# into every bundled game world, which isn't our code and isn't mypy-clean.
# Instead we leave those two imports unresolved (-> Any) and only relax the
# one strict check that matters for subclassing an Any-typed external base.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["BaseClasses", "worlds.AutoWorld"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["mgsdelta/test"]

[tool.coverage.run]
source = ["mgsdelta"]
omit = ["mgsdelta/test/*"]

[tool.coverage.report]
# fail_under is deliberately NOT set here: pytest-cov's own fail-under check
# is flaky when total statements == 0 (nedbat/coveragepy#1470,
# pytest-dev/pytest-cov#641) — identical zero-logic input has been observed
# to report both 100% and 0%. scripts/check_coverage.py enforces the 100%
# gate deterministically instead, from coverage's own JSON totals.
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
paths_to_mutate = ["mgsdelta/"]
do_not_mutate = ["mgsdelta/test/*"]
runner = "python -m pytest -x -q"
